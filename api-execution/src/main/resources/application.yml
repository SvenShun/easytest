server:
  port: 8084

spring:
  application:
    name: api-execution
  datasource:
    # H2 file DB by default; the mysql profile switches to MySQL below.
    url: jdbc:h2:file:./data/db/apiexec;MODE=MySQL;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      # We use Redis as a queue only; no Spring Data Redis repositories.
      repositories:
        enabled: false

easytest:
  apiexec:
    # EASYTEST_APIEXEC_CALLBACK_URL is accepted as a compatibility alias (dev-up.sh).
    core-base-url: ${EASYTEST_CORE_URL:${EASYTEST_APIEXEC_CALLBACK_URL:http://127.0.0.1:8080}}
    public-base-url: ${EASYTEST_APIEXEC_PUBLIC_URL:http://127.0.0.1:8084}
    # Optional callback-token override; blank reuses easytest.security.service-token.
    service-token: ${EASYTEST_APIEXEC_SERVICE_TOKEN:}
    workers: ${EASYTEST_APIEXEC_WORKERS:4}
    # memory (default, in-process) or redis (shared queue across instances).
    queue: ${EASYTEST_APIEXEC_QUEUE:memory}
    redis-key-prefix: ${EASYTEST_APIEXEC_REDIS_KEY_PREFIX:easytest:apiexec:}
    # Blank means hostname + random suffix; workers are {instance-id}-{index}.
    instance-id: ${EASYTEST_APIEXEC_INSTANCE_ID:}
    default-timeout-sec: ${EASYTEST_APIEXEC_DEFAULT_TIMEOUT_SEC:30}
    callback-enabled: ${EASYTEST_APIEXEC_CALLBACK_ENABLED:true}
  security:
    jwt-secret: ${EASYTEST_JWT_SECRET:easytest-dev-jwt-secret-change-me-0123456789abcdef}
    service-token: ${EASYTEST_SERVICE_TOKEN:${EASYTEST_APIEXEC_SERVICE_TOKEN:easytest-dev-service-token}}
    agent-token: ${EASYTEST_AGENT_TOKEN:easytest-dev-agent-token}
    encryption-key: ${EASYTEST_ENCRYPTION_KEY:easytest-dev-encryption-key-change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    # The memory queue does not need Redis; opt in with EASYTEST_APIEXEC_REDIS_HEALTH=true.
    redis:
      enabled: ${EASYTEST_APIEXEC_REDIS_HEALTH:false}
