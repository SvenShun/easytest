server:
  port: 8081

spring:
  application:
    name: ui-execution
  datasource:
    url: jdbc:h2:file:./data/db/uiexec;MODE=MySQL;AUTO_SERVER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  h2:
    console:
      enabled: true
      path: /h2-console
  data:
    redis:
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${TESTHUB_KAFKA_BOOTSTRAP:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  jackson:
    serialization:
      write-dates-as-timestamps: false

testhub:
  uiexec:
    core-base-url: ${TESTHUB_CORE_URL:http://127.0.0.1:8080}
    public-base-url: ${TESTHUB_UIEXEC_PUBLIC_URL:http://127.0.0.1:8081}
    callback-base-url: ${TESTHUB_UIEXEC_CALLBACK_URL:}
    artifact-dir: ${TESTHUB_ARTIFACT_DIR:./data/artifacts}
    artifact-store: ${TESTHUB_ARTIFACT_STORE:local}
    queue-store: ${TESTHUB_QUEUE_STORE:memory}
    agent-offline-seconds: 90
    watchdog-enabled: ${TESTHUB_UIEXEC_WATCHDOG_ENABLED:true}
    # local: structured task events in the log; kafka: publish to
    # ui-execution.task.dispatch / ui-execution.task.result
    event-bus: ${TESTHUB_EVENT_BUS:local}
    # testhub: internal case-management API; metersphere: MeterSphere v3 functional case API.
    case-source: ${TESTHUB_CASE_SOURCE:testhub}
    metersphere:
      base-url: ${TESTHUB_METERSHPHERE_BASE_URL:http://127.0.0.1:8081}
      token: ${TESTHUB_METERSHPHERE_TOKEN:}
      csrf-token: ${TESTHUB_METERSHPHERE_CSRF_TOKEN:}
      project-id: ${TESTHUB_METERSHPHERE_PROJECT_ID:}
      require-review: ${TESTHUB_METERSHPHERE_REQUIRE_REVIEW:false}
      approved-review-statuses: ${TESTHUB_METERSHPHERE_APPROVED_STATUSES:COMPLETED}
    minio:
      endpoint: ${TESTHUB_MINIO_ENDPOINT:http://127.0.0.1:9000}
      access-key: ${TESTHUB_MINIO_ACCESS_KEY:minioadmin}
      secret-key: ${TESTHUB_MINIO_SECRET_KEY:minioadmin}
      bucket: ${TESTHUB_MINIO_BUCKET:testhub}
  security:
    jwt-secret: ${TESTHUB_JWT_SECRET:testhub-dev-jwt-secret-change-me-0123456789abcdef}
    service-token: ${TESTHUB_SERVICE_TOKEN:testhub-dev-service-token}
    agent-token: ${TESTHUB_AGENT_TOKEN:testhub-dev-agent-token}
    encryption-key: ${TESTHUB_ENCRYPTION_KEY:testhub-dev-encryption-key-change-me}

management:
  health:
    # Redis and Kafka are opt-in backends; their absence must not mark the
    # service DOWN when the local/in-memory adapters are used.
    redis:
      enabled: false
    kafka:
      enabled: false
