services:
  mysql:
    image: public.ecr.aws/docker/library/mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-easytest}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -p$${MYSQL_ROOT_PASSWORD} >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "3306:3306"

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "6379:6379"

  minio:
    # Docker Hub / dl.min.io are unreachable from this network; Chainguard ships
    # the upstream MinIO server binary.
    image: cgr.dev/chainguard/minio:latest
    user: root
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-easytest}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-easytest123}
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  core:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.core
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/easytest_core?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-easytest}
      EASYTEST_JWT_SECRET: ${EASYTEST_JWT_SECRET:-change-me-jwt-secret-please-32bytes}
      EASYTEST_SERVICE_TOKEN: ${EASYTEST_SERVICE_TOKEN:-change-me-service-token}
      EASYTEST_AGENT_TOKEN: ${EASYTEST_AGENT_TOKEN:-change-me-agent-token}
      EASYTEST_ENCRYPTION_KEY: ${EASYTEST_ENCRYPTION_KEY:-change-me-encryption-key}
      EASYTEST_PUBLIC_BASE_URL: ${EASYTEST_PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      EASYTEST_UI_EXECUTION_BASE_URL: http://ui-execution:8081
      EASYTEST_API_EXECUTION_URLS: http://api-execution:8084
      EASYTEST_APIEXEC_CALLBACK_URL: http://core:8080
      EASYTEST_INTERNAL_BASE_URL: http://core:8080
      EASYTEST_ARTIFACT_DIR: /data/artifacts
      EASYTEST_ARTIFACT_STORE: minio
      EASYTEST_MINIO_ENDPOINT: http://minio:9000
      EASYTEST_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-easytest}
      EASYTEST_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-easytest123}
      EASYTEST_MINIO_BUCKET: easytest-core
    volumes:
      - core-artifacts:/data/artifacts
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_started
    ports:
      - "8080:8080"

  kafka:
    image: quay.io/strimzi/kafka:0.43.0-kafka-3.8.0
    user: root
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-storage.sh format -t MkU3OEVBNTcwNTJENDM2Qk
        -c /opt/kafka/config/easytest/server.properties --ignore-formatted &&
        exec /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/easytest/server.properties
    volumes:
      - ./kafka:/opt/kafka/config/easytest:ro
      - kafka-data:/tmp/kraft-logs
    ports:
      - "9092:9092"

  api-execution:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.apiexec
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/easytest_apiexec?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-easytest}
      EASYTEST_JWT_SECRET: ${EASYTEST_JWT_SECRET:-change-me-jwt-secret-please-32bytes}
      EASYTEST_SERVICE_TOKEN: ${EASYTEST_SERVICE_TOKEN:-change-me-service-token}
      EASYTEST_AGENT_TOKEN: ${EASYTEST_AGENT_TOKEN:-change-me-agent-token}
      EASYTEST_ENCRYPTION_KEY: ${EASYTEST_ENCRYPTION_KEY:-change-me-encryption-key}
      EASYTEST_CORE_URL: http://core:8080
      EASYTEST_APIEXEC_PUBLIC_URL: ${EASYTEST_APIEXEC_PUBLIC_URL:-http://127.0.0.1:8084}
      EASYTEST_APIEXEC_CALLBACK_URL: http://core:8080
      EASYTEST_APIEXEC_WORKERS: 4
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8084:8084"

  ui-execution:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.uiexec
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/easytest_uiexec?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_ROOT_PASSWORD:-easytest}
      EASYTEST_JWT_SECRET: ${EASYTEST_JWT_SECRET:-change-me-jwt-secret-please-32bytes}
      EASYTEST_SERVICE_TOKEN: ${EASYTEST_SERVICE_TOKEN:-change-me-service-token}
      EASYTEST_AGENT_TOKEN: ${EASYTEST_AGENT_TOKEN:-change-me-agent-token}
      EASYTEST_ENCRYPTION_KEY: ${EASYTEST_ENCRYPTION_KEY:-change-me-encryption-key}
      EASYTEST_CORE_URL: http://core:8080
      EASYTEST_UIEXEC_PUBLIC_URL: ${EASYTEST_UIEXEC_PUBLIC_URL:-http://127.0.0.1:8081}
      EASYTEST_UIEXEC_CALLBACK_URL: http://ui-execution:8081
      EASYTEST_QUEUE_STORE: redis
      SPRING_DATA_REDIS_HOST: redis
      EASYTEST_EVENT_BUS: kafka
      EASYTEST_KAFKA_BOOTSTRAP: kafka:9092
      EASYTEST_ARTIFACT_STORE: minio
      EASYTEST_ARTIFACT_DIR: /data/artifacts
      EASYTEST_MINIO_ENDPOINT: http://minio:9000
      EASYTEST_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-easytest}
      EASYTEST_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-easytest123}
      EASYTEST_MINIO_BUCKET: easytest-ui
    volumes:
      - ui-artifacts:/data/artifacts
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "8081:8081"

  ai-runtime:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.runtime
    ports:
      - "8095:8095"

  device-agent:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
    environment:
      EASYTEST_AGENT_NAME: device-agent-docker
      EASYTEST_AGENT_HOST: device-agent
      EASYTEST_AGENT_BASE_URL: http://device-agent:8090
      EASYTEST_UIEXEC_URL: http://ui-execution:8081
      EASYTEST_RUNTIME_URL: http://ai-runtime:8095
      EASYTEST_AGENT_TOKEN: ${EASYTEST_AGENT_TOKEN:-change-me-agent-token}
      EASYTEST_AGENT_MODE: simulated
      EASYTEST_AGENT_DATA_DIR: /data/agent
    volumes:
      - agent-data:/data/agent
    depends_on:
      - ui-execution
      - ai-runtime
    ports:
      - "8090:8090"

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    depends_on:
      - core
      - ui-execution
    ports:
      - "${EASYTEST_WEB_PORT:-5173}:80"

volumes:
  mysql-data:
  redis-data:
  minio-data:
  kafka-data:
  core-artifacts:
  ui-artifacts:
  agent-data:
