# Real middleware for TestHub, for developers who run the Java services on the host.
#   docker compose -f deploy/docker-compose.infra.yml up -d
#   TESTHUB_INFRA=docker ./scripts/dev-up.sh
services:
  mysql:
    image: public.ecr.aws/docker/library/mysql:8.0
    container_name: testhub-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-testhub}
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - testhub-mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ptesthub"]
      interval: 5s
      timeout: 5s
      retries: 40

  redis:
    image: public.ecr.aws/docker/library/redis:7-alpine
    container_name: testhub-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - testhub-redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Chainguard's MinIO build is used because Docker Hub and dl.min.io are
    # unreachable from this network; it is the upstream MinIO server binary.
    image: cgr.dev/chainguard/minio:latest
    container_name: testhub-minio
    user: root
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-testhub}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-testhub123}
    volumes:
      - testhub-minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  kafka:
    # Single-node KRaft broker (Strimzi distribution of Apache Kafka 3.8).
    image: quay.io/strimzi/kafka:0.43.0-kafka-3.8.0
    container_name: testhub-kafka
    user: root
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-storage.sh format -t MkU3OEVBNTcwNTJENDM2Qk
        -c /opt/kafka/config/testhub/server.properties --ignore-formatted &&
        exec /opt/kafka/bin/kafka-server-start.sh /opt/kafka/config/testhub/server.properties
    volumes:
      - ./kafka:/opt/kafka/config/testhub:ro
      - testhub-kafka-data:/tmp/kraft-logs
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

volumes:
  testhub-mysql-data:
  testhub-redis-data:
  testhub-minio-data:
  testhub-kafka-data:
